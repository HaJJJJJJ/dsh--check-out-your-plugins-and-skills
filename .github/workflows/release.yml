name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build source zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "HarnessIndex-${{ github.ref_name }}"
          $stage = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $items = @(
            'server.ps1',
            'install.ps1',
            'Start Harness Index.cmd',
            'README.md',
            'DESIGN.md',
            'LICENSE',
            'app',
            'assets',
            'docs'
          )
          foreach ($item in $items) {
            if (Test-Path -LiteralPath $item) {
              Copy-Item -LiteralPath $item -Destination $stage -Recurse -Force
            }
          }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "$name.zip" -Force
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File "$name.zip.sha256" -Encoding ascii

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HarnessIndex-*.zip
            HarnessIndex-*.zip.sha256
          generate_release_notes: true
